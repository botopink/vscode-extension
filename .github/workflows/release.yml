# Release pipeline: pushing a `v*` tag packages the extension into a `.vsix`,
# uploads it to a GitHub Release, and (only when `VSCE_PAT` is configured)
# publishes the same `.vsix` to the VS Code Marketplace.
#
# No sha256 sidecar — the marketplace verifies signatures and the install
# path for `.vsix` is `code --install-extension`, not bpmp.
name: release

on:
  push:
    tags: ['v*']

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: Package (vsce → dist/*.vsix)
        run: npm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
          retention-days: 7
          if-no-files-found: error

  publish-gh:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v5

      - name: Download .vsix
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.vsix
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-marketplace:
    needs: package
    # Skip when `VSCE_PAT` is not configured (the default for a fresh fork or
    # a contributor PR). A tag push still ships a `.vsix` via publish-gh.
    if: ${{ secrets.VSCE_PAT != '' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: Download .vsix
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath dist/*.vsix --pat "$VSCE_PAT"
