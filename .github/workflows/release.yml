# Release pipeline: pushing a `v*` tag packages the extension into a `.vsix`,
# uploads it to a GitHub Release, and (only when `VSCE_PAT` is configured)
# publishes the same `.vsix` to the VS Code Marketplace.
#
# No sha256 sidecar — the marketplace verifies signatures and the install
# path for `.vsix` is `code --install-extension`, not bpmp.
name: release

on:
  push:
    tags: ['v*']

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: Package (vsce → dist/*.vsix)
        run: npm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
          retention-days: 7
          if-no-files-found: error

  publish-gh:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v5

      - name: Download .vsix
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.vsix
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-marketplace:
    needs: package
    runs-on: ubuntu-22.04
    # `secrets` is not available in a job-level `if:` — GitHub rejects the
    # whole file (every push then shows a failed run with no jobs). The
    # secret goes through `env`, which a step-level `if:` can read.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      # Without `VSCE_PAT` (a fresh fork) the job ends after this step; a tag
      # push still ships a `.vsix` via publish-gh.
      - name: Marketplace token
        id: pat
        run: |
          if [ -n "$VSCE_PAT" ]; then echo "set=1" >> "$GITHUB_OUTPUT"; else echo "VSCE_PAT unset: not publishing to the Marketplace"; fi

      - if: steps.pat.outputs.set == '1'
        name: Checkout
        uses: actions/checkout@v5

      - if: steps.pat.outputs.set == '1'
        name: Install Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - if: steps.pat.outputs.set == '1'
        name: npm ci
        run: npm ci

      - if: steps.pat.outputs.set == '1'
        name: Download .vsix
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist

      - if: steps.pat.outputs.set == '1'
        name: Publish to Marketplace
        run: npx --yes @vscode/vsce publish --packagePath dist/*.vsix --pat "$VSCE_PAT"
